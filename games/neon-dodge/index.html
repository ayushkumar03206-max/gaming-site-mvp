<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Neon Dodge</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="game.css">
</head>
<body>
<canvas id="c" tabindex="-1" role="img" aria-label="Neon Dodge play field"></canvas>
<p class="sr" id="live" role="status" aria-live="polite"></p>
<button type="button" id="pauseBtn" class="pause-btn" aria-label="Pause" hidden>❚❚</button>

<div class="overlay" id="title">
  <div class="panel">
    <h1 class="logo">NEON<span>DODGE</span></h1>
    <p>Dodge bars, shards and lasers. Grab <b class="core">●</b> cores for +50.</p>
    <p class="best" id="bestTitle"></p>
    <button type="button" class="big" id="playBtn">Play</button>
    <p class="hint"><span class="kb">Arrows / WASD</span> to move · <span class="kb">P</span> pause<br><span class="touch">On touch: drag anywhere</span></p>
  </div>
</div>

<div class="overlay" id="paused" hidden>
  <div class="panel">
    <h2>Paused</h2>
    <button type="button" class="big" id="resumeBtn">Resume</button>
    <button type="button" class="ghost" id="restartBtn">Restart</button>
  </div>
</div>

<div class="overlay" id="over" hidden role="dialog" aria-labelledby="overTitle">
  <div class="panel">
    <h2 id="overTitle">Crashed!</h2>
    <p class="final"><span id="finalScore">0</span><small>points</small></p>
    <p class="best" id="bestOver"></p>
    <button type="button" class="big" id="againBtn">Play again</button>
    <p class="hint">Press <span class="kb">Enter</span> or <span class="kb">R</span></p>
  </div>
</div>
<noscript><p>Neon Dodge needs JavaScript enabled.</p></noscript>
<script src="neon-logic.js"></script>
<script src="game.js"></script>
</body>
</html>
