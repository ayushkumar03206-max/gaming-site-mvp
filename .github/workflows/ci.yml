name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]   # main is tested by pages.yml before deploying
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rights gate (strict)
        run: python scripts/rights_gate.py --strict
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Game logic tests
        run: node --test tests/js/games.test.js
      - name: Build
        run: python scripts/build_static_site.py --strict
      - name: Link check
        run: python scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
