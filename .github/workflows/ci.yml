name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]   # main is tested by pages.yml before deploying
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Branch CI reports the rights gate and builds a PREVIEW (pending games included, banner + noindex).
      # The strict gate is enforced where it matters: pages.yml refuses to deploy anything not approved.
      - name: Rights gate (report)
        run: python scripts/rights_gate.py
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Game logic tests
        run: node --test tests/js/*.test.js
      - name: Multiplayer server tests
        run: if [ -d server ]; then cd server && npm ci && npm test; fi
      - name: Build (preview)
        run: python scripts/build_static_site.py --preview-pending
      - name: Link check
        run: python scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
